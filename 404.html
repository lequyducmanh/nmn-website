<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Không tìm thấy trang · Clastive Nhật Việt</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root{ --bg:#f4f0e9; --ink:#2b2a27; --muted:#6c6760; --blue:#3f97d6; }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
    font:16px/1.6 "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding:24px 16px; text-align:center; }
  img{ height:44px; margin-bottom:28px; }
  h1{ font:600 clamp(26px, 6vw, 36px)/1.25 Lora, Georgia, serif; margin:0 0 10px; }
  p{ color:var(--muted); margin:0 auto 26px; max-width:440px; }
  a.btn{ display:inline-block; background:var(--ink); color:#fff; text-decoration:none; padding:13px 26px; border-radius:999px; font-weight:500; }
  a.btn:hover{ background:var(--blue); }
  small{ display:block; margin-top:18px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <a href="/"><img src="/assets/brand/clastive-logo.svg" alt="Clastive Nhật Việt"></a>
  <h1>Không tìm thấy trang này</h1>
  <p>Đường dẫn có thể đã thay đổi hoặc không còn tồn tại. Bạn quay lại trang chủ để xem sản phẩm nhé.</p>
  <a class="btn" href="/">Về trang chủ</a>
  <small id="auto">Tự chuyển về trang chủ sau 6 giây…</small>
</main>
<script>setTimeout(function(){ location.replace("/"); }, 6000);</script>
</body>
</html>
