<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f4f0e9">
<title>Quản lý đơn hàng · NMN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Lora:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css?v=20261027i">
<link rel="stylesheet" href="orders.css?v=20261027i">
</head>
<body>

<!-- ============================ ĐĂNG NHẬP ============================ -->
<section id="gate" class="login">
  <div class="login-card">
    <div class="brand"><span class="dot"></span><span>NMN <small>QUẢN LÝ ĐƠN HÀNG</small></span></div>
    <h1 id="gate-title">Đăng nhập</h1>
    <p class="muted" id="gate-text">Đăng nhập bằng tài khoản Google đã được cấp quyền quản trị.</p>
    <button class="btn btn-ink wide" id="g-login" type="button" hidden>
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="#fff" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3z"/><path fill="#fff" opacity=".8" d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z"/><path fill="#fff" opacity=".6" d="M6.4 14c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V7.4H3.1a10 10 0 0 0 0 9.2L6.4 14z"/><path fill="#fff" opacity=".9" d="M12 6c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0 0 3.1 7.4L6.4 10C7.2 7.7 9.4 6 12 6z"/></svg>
      Đăng nhập với Google</button>
    <button class="btn btn-line wide" id="g-logout" type="button" hidden>Đăng xuất</button>
    <p class="err" id="gate-err" role="alert"></p>
    <p class="muted small" style="margin-top:18px"><a href="./">← Quản trị nội dung</a> · <a href="../" target="_blank" rel="noopener">Xem website ↗</a></p>
  </div>
</section>

<!-- ============================ ỨNG DỤNG ============================ -->
<div id="app" class="app" hidden>
  <aside class="side" id="side">
    <div class="brand"><span class="dot"></span><span>NMN <small>BÁN HÀNG</small></span></div>
    <nav id="nav" aria-label="Mục quản lý">
      <button data-tab="orders"><i>▤</i>Đơn hàng <b class="cnt" id="cnt-orders" hidden></b></button>
      <button data-tab="contacts"><i>✉</i>Lời nhắn <b class="cnt" id="cnt-contacts" hidden></b></button>
      <button data-tab="payments"><i>₫</i>Thanh toán · SePay</button>
    </nav>
    <div class="side-foot">
      <a href="./">Quản trị nội dung →</a>
      <a href="../" target="_blank" rel="noopener">Xem website ↗</a>
      <div class="who" id="who"></div>
      <button class="link" id="logout">Đăng xuất</button>
    </div>
  </aside>
  <div class="side-ov" id="side-ov"></div>

  <div class="main">
    <header class="bar">
      <button class="icon menu-btn" id="menu-btn" aria-label="Mở menu">☰</button>
      <h1 id="title">Đơn hàng</h1>
      <div class="bar-actions"><span class="live" id="live" title="Đang cập nhật trực tiếp"><i></i>Trực tiếp</span></div>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
</div>

<div class="modal" id="modal" hidden><div class="modal-card od-card" role="dialog" aria-modal="true" aria-labelledby="od-title" id="modal-card"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="orders.js?v=20261027i" type="module"></script>
</body>
</html>
